<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daily Public Records — Micheal Ray Berry</title>
  <meta name="description" content="Daily public weigh-in and media records for the Micheal Ray Berry Public Accountability Project.">
  <link rel="canonical" href="https://michealrayberry.com/daily-records/">
  <link rel="alternate" type="application/json" href="/api/public/daily-records">
  <link rel="stylesheet" href="/daily-records/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Micheal Ray Berry</a>
    <nav aria-label="Public record navigation"><a href="/progress/">Progress</a><a href="/daily-records/" aria-current="page">Daily records</a><a href="/agreement">Agreement</a></nav>
  </header>
  <main>
    <section class="hero">
      <p class="eyebrow">Database-backed public record</p>
      <h1>Daily records</h1>
      <p id="status" role="status">Loading verified daily records…</p>
    </section>
    <section class="summary" aria-label="Daily record summary">
      <article><span>Recorded days</span><strong id="record-count">—</strong></article>
      <article><span>Media-complete</span><strong id="complete-count">—</strong></article>
      <article><span>Media-incomplete</span><strong id="incomplete-count">—</strong></article>
      <article><span>Public media items</span><strong id="media-count">—</strong></article>
    </section>
    <section class="records-panel">
      <div class="section-heading"><div><p class="eyebrow">Daily inventory</p><h2>Published records</h2></div><a href="/api/public/daily-records">JSON source</a></div>
      <div id="records" class="records" aria-live="polite"></div>
    </section>
  </main>
  <footer><a href="/progress/">Weight progress</a><span>Timezone: America/New_York</span></footer>
  <script type="module" src="/daily-records/app.js"></script>
</body>
</html>
