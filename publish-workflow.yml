name: Publish daily record pages

# Rebuilds the per-day SEO pages, manifests, and sitemaps from the record
# spreadsheet, then pings IndexNow with whatever actually changed.
# Runs nightly after the 10 PM ET deadline, and on demand.

on:
  schedule:
    - cron: '30 3 * * *'   # 11:30 PM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node scripts/publish.mjs
        env:
          SITE_ORIGIN: https://michealrayberry.com
      - name: Commit generated pages
        run: |
          git config user.name "record-bot"
          git config user.email "ap@michealrayberry.com"
          git add daily manifests media sitemap*.xml
          git diff --staged --quiet || git commit -m "Publish daily record pages"
          git push
      - run: node scripts/submit-indexnow.mjs
        env:
          SITE_ORIGIN: https://michealrayberry.com
