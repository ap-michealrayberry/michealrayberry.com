[build]
  command = "npm run build"
  publish = "."

[[redirects]]
  from = "/dashboard"
  to = "/progress/"
  status = 301

[[redirects]]
  from = "/dashboard/*"
  to = "/progress/"
  status = 301

[[redirects]]
  from = "/record"
  to = "/daily-records/"
  status = 301

[[redirects]]
  from = "/record/*"
  to = "/daily-records/"
  status = 301

[[redirects]]
  from = "/penalties"
  to = "/violations/"
  status = 301

[[redirects]]
  from = "/penalties/*"
  to = "/violations/"
  status = 301

[[headers]]
  for = "/ap/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[headers]]
  for = "/dataset.json"
  [headers.values]
    Content-Type = "application/ld+json; charset=utf-8"
    Cache-Control = "public, max-age=3600"
    Link = "</api/public/progress.csv>; rel=alternate; type=text/csv"

[[headers]]
  for = "/datapackage.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/progress/*"
  [headers.values]
    Link = "</dataset.json>; rel=describedby; type=application/ld+json, </api/public/progress.csv>; rel=alternate; type=text/csv"

[[headers]]
  for = "/project-status/*"
  [headers.values]
    Link = "</api/public/progress>; rel=describedby; type=application/json, </api/public/violations>; rel=describedby; type=application/json"

[[headers]]
  for = "/api/public/progress"
  [headers.values]
    Link = "</dataset.json>; rel=describedby; type=application/ld+json, </api/public/progress.csv>; rel=alternate; type=text/csv"

[[headers]]
  for = "/api/public/progress.csv"
  [headers.values]
    Link = "</dataset.json>; rel=describedby; type=application/ld+json, </api/public/progress>; rel=alternate; type=application/json"
