# This repo IS the website — the root holds index.html and all assets, and
# the build step only *adds* generated pages (/daily, /weeks, sitemaps) in
# place. There is no dist/ directory. These settings override any build
# command / publish directory set in the Netlify UI (which pointed at dist).
[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"
  SITE_ORIGIN = "https://michealrayberry.com"
