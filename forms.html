<!-- Netlify Forms detection twin for /observer/ (generated at build). Not served: _redirects 404s it. -->
<form name="observer" method="POST" data-netlify="true" netlify-honeypot="website">
  <input type="hidden" name="form-name" value="observer">
  <select name="type"><option>Encouragement</option><option>I know Micheal personally</option><option>Possible compliance issue</option><option>Found/shared elsewhere</option><option>Question</option><option>Other</option></select>
  <textarea name="message"></textarea>
  <input type="text" name="name"><input type="email" name="email"><input type="url" name="source_url">
  <input type="checkbox" name="quotable"><input type="text" name="website">
</form>
