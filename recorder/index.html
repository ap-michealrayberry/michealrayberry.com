<!doctype html>
<html lang="en-US">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Daily Packet Recorder</title>
  <link rel="stylesheet" href="./assets/recorder.css">
</head>
<body>
  <header>
    <p class="eyebrow">Participant interface</p>
    <h1>Daily Packet</h1>
    <p>One guided process. Nothing here can declare or resolve a violation.</p>
  </header>
  <main>
    <section class="card">
      <div class="grid">
        <label>Date<input id="date" type="date"></label>
        <label>Weight (lb)<input id="weight" type="number" min="1" step="0.1" inputmode="decimal"></label>
      </div>
      <div class="camera">
        <video id="camera" playsinline muted></video>
        <canvas id="canvas" hidden></canvas>
      </div>
      <div class="actions">
        <button id="start-camera">Start camera</button>
        <button id="start-video" disabled>Record video</button>
        <button id="stop-video" disabled>Stop video</button>
      </div>
    </section>

    <section class="card">
      <h2>Four photographs</h2>
      <div class="photo-actions">
        <button data-angle="front" disabled>Capture front</button>
        <button data-angle="left" disabled>Capture left</button>
        <button data-angle="rear" disabled>Capture rear</button>
        <button data-angle="right" disabled>Capture right</button>
      </div>
      <div id="photos" class="photos"></div>
    </section>

    <section class="card">
      <h2>Packet review</h2>
      <ul id="checklist"></ul>
      <p id="message" role="status"></p>
      <button id="download" class="primary" disabled>Download packet manifest</button>
    </section>
  </main>
  <script src="../shared/project-config.js"></script>
  <script src="./assets/recorder.js" defer></script>
</body>
</html>
