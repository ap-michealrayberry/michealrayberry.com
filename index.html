  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #6B6A64;\">Public Accountability Project<\u002Fspan>\n      <\u002Fdiv>\n      <nav style=\"display: flex; gap: 2px; row-gap: 6px; flex-wrap: wrap; align-items: center;\">\n        <button sc-camel-on-click=\"{{ goHome }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Home<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goDashboard }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Dashboard<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAbout }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">About<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goAgreement }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Agreement<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goPenalties }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Violations<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goUniform }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Uniform<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ goUpdates }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: none; padding: 10px 9px; cursor: pointer; color: #141412;\" style-hover=\"color: #B3261E; text-decoration: underline; text-underline-offset: 4px;\">Updates<\u002Fbutton>\n                <button sc-camel-on-click=\"{{ goRecord }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; background: none; border: 1px solid #141412; padding: 9px 12px; cursor: pointer; color: #141412; margin-left: 6px;\" style-hover=\"background: #141412; color: #FAFAF7;\">Record<\u002Fbutton>\n      <\u002Fnav>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"flex: 1;\">\n\n  <!-- ==================== HOME ==================== -->\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n  <div data-screen-label=\"Home\">\n\n    <!-- Hero -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 88px 32px 72px;\">\n      <div class=\"mrb-hero\" style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: 1fr minmax(220px, 300px); gap: 56px; align-items: start;\">\n      <div>\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 28px;\">Project activated: July 20, 2026<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(48px, 8vw, 104px); line-height: 0.98; letter-spacing: -0.01em; text-transform: uppercase; margin: 0 0 40px; max-width: 900px;\">Public Accountability Project<\u002Fh1>\n        <div style=\"display: flex; align-items: baseline; gap: 24px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; margin-bottom: 44px;\">\n          <span style=\"font-size: clamp(40px, 6vw, 72px); font-weight: 600;\">340<\u002Fspan>\n          <span style=\"font-size: clamp(18px, 2vw, 26px); font-weight: 600; color: #6B6A64;\">LB<\u002Fspan>\n          <span style=\"font-size: clamp(24px, 3vw, 36px); color: #6B6A64;\">→<\u002Fspan>\n          <span style=\"font-size: clamp(40px, 6vw, 72px); font-weight: 600; color: #B3261E;\">175<\u002Fspan>\n          <span style=\"font-size: clamp(18px, 2vw, 26px); font-weight: 600; color: #B3261E;\">LB<\u002Fspan>\n          <span style=\"font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; color: #6B6A64;\">· Completion requires 28 consecutive days at goal<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"max-width: 640px; display: flex; flex-direction: column; gap: 16px; font-size: 18px; line-height: 1.6;\">\n          <p style=\"margin: 0;\">My name is Micheal Ray Berry. On July 20, 2026, this project begins at a starting weight of 340 pounds.<\u002Fp>\n          <p style=\"margin: 0;\">This is a structured, daily commitment. Not a challenge, not a phase, and not something I start and stop.<\u002Fp>\n          <p style=\"margin: 0;\">Every day by 10:00 PM Eastern, I publish a standardized inspection video to YouTube, capture the four-angle daily photos, record my weight, and update the public tracker.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n        <div style=\"width: 100%; aspect-ratio: 3 / 4; border: 1px solid #141412;\">\n          <img data-photo-src=\"https://static.wixstatic.com/media/512909_30b0842754344a4ebf933f91809e2c85~mv2.jpg\" alt=\"Day 1 front photo — recorded July 20, 2026\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n        <\u002Fdiv>\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">Day 001 — 340 LB. Where this record begins.<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Status counters -->\n    <section style=\"border-bottom: 1px solid #141412; background: #141412; color: #FAFAF7; padding: 0 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); \">\n        <div style=\"padding: 36px 24px 36px 0; display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8983;\">Day<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1;\">{{ dayNumber }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 36px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #3A3935;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8983;\">Starting weight<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1;\">{{ startLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 36px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #3A3935;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #8A8983;\">Last recorded<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1;\">{{ currentLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 36px 0 36px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #3A3935;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">Goal<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 52px; font-weight: 600; line-height: 1;\">{{ goalLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Three paths -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 80px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 40px; text-transform: uppercase; letter-spacing: 0.01em; margin: 0 0 12px;\">Three Possible Outcomes<\u002Fh2>\n        <p style=\"font-size: 17px; color: #6B6A64; margin: 0 0 48px;\">From the start, there are only three. There is no Path 4.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0; border: 1px solid #141412;\">\n          <div style=\"padding: 36px 32px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid #141412;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid #141412; align-self: flex-start; padding: 6px 12px;\">Path 1<\u002Fspan>\n            <h3 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0;\">Full Compliance<\u002Fh3>\n            <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5;\">\n              <li>Each day is documented.<\u002Fli>\n              <li>Each weigh-in is posted.<\u002Fli>\n              <li>Each entry is logged.<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin: auto 0 0; font-size: 15px; color: #6B6A64;\">Completion requires sustained documentation. Every missed requirement remains part of the record.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 36px 32px; display: flex; flex-direction: column; gap: 18px; border-right: 1px solid #141412;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid #B3261E; color: #B3261E; align-self: flex-start; padding: 6px 12px;\">Path 2<\u002Fspan>\n            <h3 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0;\">Accountability Enforcement<\u002Fh3>\n            <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5;\">\n              <li>Missed documentation activates the accountability structure.<\u002Fli>\n              <li>Consequences are administered privately by the Accountability Partner.<\u002Fli>\n              <li>The miss itself stays on the public record permanently.<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin: auto 0 0; font-size: 15px; color: #6B6A64;\">Enforcement is automatic, not negotiated.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 36px 32px; display: flex; flex-direction: column; gap: 18px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; border: 1px solid #141412; align-self: flex-start; padding: 6px 12px;\">Path 3<\u002Fspan>\n            <h3 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 26px; text-transform: uppercase; margin: 0;\">Project Abandonment<\u002Fh3>\n            <ul style=\"margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5;\">\n              <li>If the project is abandoned, the record remains public.<\u002Fli>\n              <li>The starting weight, the last recorded date, and the unfinished goal remain visible.<\u002Fli>\n            <\u002Ful>\n            <p style=\"margin: auto 0 0; font-size: 15px; color: #6B6A64;\">There is no unrecorded ending to this project.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Video -->\n    <sc-if value=\"{{ showVideos }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 80px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 48px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 40px; text-transform: uppercase; margin: 0;\">Project Introduction<\u002Fh2>\n          <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; background: #141412;\">\n            <iframe src=\"https://www.youtube.com/embed/jkh8ALpeFbw?rel=0\" title=\"Project statement video\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0;\" allowfullscreen=\"{{ true }}\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 20px;\">\n          <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 40px; text-transform: uppercase; margin: 0;\">Daily Inspection<\u002Fh2>\n          <div style=\"position: relative; width: 100%; aspect-ratio: 16 / 9; background: #141412;\">\n            <iframe src=\"https://www.youtube.com/embed/videoseries?list=PL0RDxbCGV9dZL0U3vE3v_FMwYutoOFyuu&amp;rel=0\" title=\"Daily inspection playlist\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0;\" allowfullscreen=\"{{ true }}\"><\u002Fiframe>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n\n    <!-- How you can help -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 24px;\">How you can help<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border-top: 1px solid #D8D6CF;\">\n          <div style=\"padding: 28px 24px 28px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A8983;\">01<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">Watch the daily inspection videos on YouTube.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 24px; border-bottom: 1px solid #D8D6CF; border-left: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A8983;\">02<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">Subscribe for record updates.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 24px; border-bottom: 1px solid #D8D6CF; border-left: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A8983;\">03<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">Share the website or original project posts — without alteration.<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 0 28px 24px; border-bottom: 1px solid #D8D6CF; border-left: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #8A8983;\">04<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">Report broken links or discrepancies to <a href=\"mailto:ap@michealrayberry.com\">ap@michealrayberry.com<\u002Fa>.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Subscribe -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 32px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 8px; max-width: 560px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">Witness the record<\u002Fspan>\n          <span style=\"font-size: 22px; font-weight: 600;\">Follow the record. Receive updates on violations, resolutions, and milestones.<\u002Fspan>\n          <span style=\"font-size: 15px; color: #6B6A64;\">Sent by the Accountability Partner as the record develops.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"display: flex; gap: 0;\">\n            <input type=\"email\" placeholder=\"your@email.com\" sc-camel-on-change=\"{{ onSubEmail }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 16px 18px; border: 1px solid #141412; border-right: none; background: #FFFFFF; color: #141412; width: 280px; outline: none;\">\n            <button sc-camel-on-click=\"{{ onSubscribe }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; background: #141412; color: #FAFAF7; border: 1px solid #141412; padding: 16px 26px; cursor: pointer;\" style-hover=\"background: #B3261E; border-color: #B3261E;\">Subscribe<\u002Fbutton>\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: {{ subMsgColor }}; min-height: 16px;\">{{ subMsg }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Report strip -->\n    <section style=\"padding: 56px 32px; background: #F1F0EA; border-bottom: 1px solid #141412;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 24px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">Contact<\u002Fspan>\n          <span style=\"font-size: 20px; font-weight: 600;\">The Accountability Partner administers this record.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 12px; flex-wrap: wrap;\">\n          <a href=\"mailto:ap@michealrayberry.com\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 0.06em; background: #141412; color: #FAFAF7; text-decoration: none; padding: 16px 28px;\" style-hover=\"background: #B3261E; color: #FAFAF7;\">ap@michealrayberry.com<\u002Fa>\n          <a href=\"mailto:contact@michealrayberry.com\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 0.06em; background: #FAFAF7; color: #141412; border: 1px solid #141412; text-decoration: none; padding: 15px 28px;\" style-hover=\"background: #141412; color: #FAFAF7;\">contact@michealrayberry.com<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== DASHBOARD ==================== -->\n  <sc-if value=\"{{ isDashboard }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Dashboard\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 56px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 20px;\">Tracked data — updated with every weigh-in<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0;\">Dashboard<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 20px 32px; background: #F1F0EA;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; gap: 12px 32px; flex-wrap: wrap; align-items: baseline; font-family: 'IBM Plex Mono', monospace;\">\n        <span style=\"font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">Weekly review<\u002Fspan>\n        <span style=\"font-size: 14px; font-weight: 600;\">{{ wrClosed }}<\u002Fspan>\n        <span style=\"font-size: 13px; color: #6B6A64;\">{{ wrCurrent }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 0 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));\">\n        <div style=\"padding: 40px 24px 40px 0; display: flex; flex-direction: column; gap: 8px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Day<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1;\">{{ dayNumber }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #D8D6CF;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Start<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1;\">{{ startLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #D8D6CF;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Last recorded<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1;\">{{ currentLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #D8D6CF;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Lost so far<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1;\">{{ lostLabel }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 0 40px 24px; display: flex; flex-direction: column; gap: 8px; border-left: 1px solid #D8D6CF;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">To goal<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 48px; font-weight: 600; line-height: 1; color: #B3261E;\">{{ remainingLabel }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Progress bar -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 48px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6A64;\">\n          <span>340 lbs<\u002Fspan>\n          <span>{{ pctLabel }} of 165 lbs eliminated<\u002Fspan>\n          <span style=\"color: #B3261E;\">175 lbs<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"height: 22px; border: 1px solid #141412; background: #FAFAF7; position: relative;\">\n          <div style=\"position: absolute; top: 0; left: 0; bottom: 0; background: #141412; width: {{ pctWidth }};\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Milestone ladder -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 48px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;\">\n        <div style=\"display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: #6B6A64;\">\n          <span>Milestones<\u002Fspan>\n          <span>Each milestone requires an official weigh-in and a milestone video<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 0; border: 1px solid #141412;\">\n          <sc-for list=\"{{ milestoneCells }}\" as=\"ms\" hint-placeholder-count=\"6\">\n            <div style=\"padding: 20px 8px; text-align: center; font-family: 'IBM Plex Mono', monospace; background: {{ ms.bg }}; color: {{ ms.color }}; border-right: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 4px;\">\n              <span style=\"font-size: 24px; font-weight: 600;\">{{ ms.label }}<\u002Fspan>\n              <span style=\"font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;\">{{ ms.tag }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Chart -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Weight Record<\u002Fh2>\n        <svg sc-camel-view-box=\"0 0 1000 340\" style=\"width: 100%; height: auto; display: block;\">\n          <line x1=\"60\" y1=\"20\" x2=\"60\" y2=\"300\" stroke=\"#141412\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"60\" y1=\"300\" x2=\"990\" y2=\"300\" stroke=\"#141412\" stroke-width=\"1\"><\u002Fline>\n          <line x1=\"60\" y1=\"{{ goalY }}\" x2=\"990\" y2=\"{{ goalY }}\" stroke=\"#B3261E\" stroke-width=\"1\" stroke-dasharray=\"6 5\"><\u002Fline>\n          <text x=\"66\" y=\"{{ goalLabelY }}\" fill=\"#B3261E\" font-family=\"IBM Plex Mono, monospace\" font-size=\"14\">GOAL 175<\u002Ftext>\n          <text x=\"10\" y=\"28\" fill=\"#6B6A64\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">340<\u002Ftext>\n          <text x=\"10\" y=\"164\" fill=\"#6B6A64\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">255<\u002Ftext>\n          <text x=\"10\" y=\"298\" fill=\"#6B6A64\" font-family=\"IBM Plex Mono, monospace\" font-size=\"13\">170<\u002Ftext>\n          <polyline points=\"{{ chartPoints }}\" fill=\"none\" stroke=\"#141412\" stroke-width=\"2.5\"><\u002Fpolyline>\n          <sc-for list=\"{{ chartDots }}\" as=\"dot\" hint-placeholder-count=\"1\">\n            <circle cx=\"{{ dot.x }}\" cy=\"{{ dot.y }}\" r=\"5\" fill=\"#141412\"><\u002Fcircle>\n          <\u002Fsc-for>\n        <\u002Fsvg>\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64; margin: 0;\">Every recorded weigh-in is plotted. Gaps in the record are visible by design.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Weigh-in log -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Weigh-In Log<\u002Fh2>\n        <div style=\"border: 1px solid #141412;\">\n          <div style=\"display: grid; grid-template-columns: 90px 1fr 1fr 1fr 2fr; background: #141412; color: #FAFAF7; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 12px 20px; gap: 16px;\">\n            <span>Day<\u002Fspan>\n            <span>Date<\u002Fspan>\n            <span>Weight<\u002Fspan>\n            <span>Change<\u002Fspan>\n            <span>Note<\u002Fspan>\n          <\u002Fdiv>\n          <sc-for list=\"{{ logRows }}\" as=\"row\" hint-placeholder-count=\"3\">\n            <div style=\"display: grid; grid-template-columns: 90px 1fr 1fr 1fr 2fr; font-family: 'IBM Plex Mono', monospace; font-size: 15px; padding: 14px 20px; gap: 16px; border-top: 1px solid #D8D6CF;\">\n              <span>{{ row.day }}<\u002Fspan>\n              <span>{{ row.date }}<\u002Fspan>\n              <span style=\"font-weight: 600;\">{{ row.weight }}<\u002Fspan>\n              <span style=\"color: {{ row.changeColor }};\">{{ row.change }}<\u002Fspan>\n              <span style=\"color: #6B6A64;\">{{ row.note }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <p style=\"font-size: 15px; color: #6B6A64; margin: 0; max-width: 640px;\">Up, down, or flat — it gets posted. The goal of 175 pounds must be held for 28 consecutive days before the project is complete.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Progress grid -->\n    <sc-if value=\"{{ hasPhotos }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Progress Grid<\u002Fh2>\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64; margin: 0;\">One frame per day. Same uniform, same pose, same angle. A missing square is a missed day. Select any day to inspect all four angles.<\u002Fp>\n        <div style=\"display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px; width: 220px;\">\n            <div style=\"width: 220px; aspect-ratio: 9 / 16; border: 2px solid #B3261E;\">\n              <img data-photo-src=\"https://static.wixstatic.com/media/512909_30b0842754344a4ebf933f91809e2c85~mv2.jpg\" alt=\"Day 1 baseline photo — July 20, 2026\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n            <\u002Fdiv>\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #B3261E; font-weight: 600;\">DAY 001 — 340 LB · THE STARTING POINT<\u002Fspan>\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A64;\">Every square that follows is measured against this frame.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ hasExpanded }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border: 2px solid #B3261E; background: #FFFFFF; padding: 24px; display: flex; flex-direction: column; gap: 16px;\">\n            <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 600;\">{{ expandedDate }} — {{ expandedWeight }} · All four angles<\u002Fspan>\n              <button sc-camel-on-click=\"{{ closeExpanded }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; background: #141412; color: #FAFAF7; border: none; padding: 8px 16px; cursor: pointer;\">Close<\u002Fbutton>\n            <\u002Fdiv>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px;\">\n              <sc-for list=\"{{ expandedAngles }}\" as=\"ang\" hint-placeholder-count=\"4\">\n                <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px;\">\n                  <div style=\"aspect-ratio: 9 / 16; border: 1px solid #141412; background: #F1F0EA; overflow: hidden;\">\n                    <img data-photo-src=\"{{ ang.url }}\" alt=\"Micheal Ray Berry daily accountability photo — {{ expandedDate }}, {{ ang.label }} view\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n                  <\u002Fdiv>\n                  <figcaption style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A64;\">{{ ang.label }}<\u002Ffigcaption>\n                <\u002Ffigure>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px;\">\n          <sc-for list=\"{{ photoRows }}\" as=\"ph\" hint-placeholder-count=\"3\">\n            <sc-if value=\"{{ ph.isMissed }}\" hint-placeholder-val=\"{{ false }}\">\n              <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px;\">\n                <div style=\"aspect-ratio: 9 / 16; border: 1px solid #B3261E; background: #141412; display: flex; align-items: center; justify-content: center;\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; color: #B3261E; font-weight: 700;\">MISSED<\u002Fspan>\n                <\u002Fdiv>\n                <figcaption style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A64; display: flex; justify-content: space-between; gap: 8px;\">\n                  <span>{{ ph.date }}<\u002Fspan>\n                  <span style=\"font-weight: 600; color: #B3261E;\">NO RECORD<\u002Fspan>\n                <\u002Ffigcaption>\n              <\u002Ffigure>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ ph.isPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n            <a href=\"{{ ph.href }}\" sc-camel-on-click=\"{{ ph.select }}\" style=\"text-decoration: none; color: inherit;\">\n            <figure style=\"margin: 0; display: flex; flex-direction: column; gap: 6px; cursor: pointer;\">\n              <div style=\"aspect-ratio: 9 / 16; border: 1px solid {{ ph.borderColor }}; background: #F1F0EA; overflow: hidden;\">\n                <img data-photo-src=\"{{ ph.photo }}\" alt=\"Micheal Ray Berry daily accountability photo — {{ ph.date }}, {{ ph.weight }}, front view, public weight loss record\" loading=\"lazy\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n              <\u002Fdiv>\n              <figcaption style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #6B6A64; display: flex; justify-content: space-between; gap: 8px;\">\n                <span>{{ ph.date }}<\u002Fspan>\n                <span style=\"font-weight: 600; color: #141412;\">{{ ph.weight }}<\u002Fspan>\n              <\u002Ffigcaption>\n            <\u002Ffigure>\n            <\u002Fa>\n            <\u002Fsc-if>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== ABOUT ==================== -->\n  <sc-if value=\"{{ isAbout }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"About\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 56px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <div class=\"mrb-hero\" style=\"display: grid; grid-template-columns: 1fr minmax(200px, 280px); gap: 48px; align-items: start;\">\n        <div>\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 20px;\">Section 01 — Purpose<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0 0 32px;\">About This Project<\u002Fh1>\n        <div style=\"max-width: 680px; display: flex; flex-direction: column; gap: 16px; font-size: 18px; line-height: 1.65;\">\n          <p style=\"margin: 0;\">My name is Micheal Ray Berry. This website documents my public weight loss and accountability project: 340 pounds to 175 pounds.<\u002Fp>\n          <p style=\"margin: 0;\">I did not need more information, another private plan, or another promise to myself. I needed a structure that made my actions visible, measurable, and difficult to quietly abandon. In private, I could delay, renegotiate, restart, or stop recording when the results became uncomfortable. This project exists to remove those escape routes.<\u002Fp>\n          <p style=\"margin: 0;\">I respond to external structure, immediate verification, fixed deadlines, and consequences that cannot be casually negotiated in the moment. The project takes the decision away from the tired, discouraged, impulsive version of me and places it in rules established by the clear-minded version of me.<\u002Fp>\n          <p style=\"margin: 0;\">Every day produces a public record — successful or not — so progress is based on documented action rather than intention.<\u002Fp>\n          <p style=\"margin: 0; font-weight: 600;\">Up, down, or flat — it gets posted.<\u002Fp>\n        <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n          <div style=\"width: 100%; aspect-ratio: 3 / 4; border: 1px solid #141412;\">\n            <img src=\"8dbfa307-cb65-4ec1-b446-3a29500713a5\" alt=\"Micheal Ray Berry holding the signed accountability agreement, July 20, 2026\" style=\"width: 100%; height: 100%; object-fit: cover; object-position: top;\" data-comment-anchor=\"about-portrait\">\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">Micheal Ray Berry. This record uses my real name and my real face.<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 0 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(480px, 100%), 1fr)); gap: 0 72px;\">\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">02<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Why My Real Name Is Used<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">This project is attached to my real legal name because anonymity would weaken the accountability. In the past, it has been too easy to restart privately, hide failure, change direction, or abandon the process without a lasting public record.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The point is not branding. The point is consequence.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">03<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Why the Attire Is Standardized<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">Required photos and videos are recorded in the project uniform so that changes are visible, comparisons are consistent, and the record cannot be softened by flattering clothing, angles, or presentation.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The purpose is not fashion. The purpose is honesty.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">04<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Daily Documentation<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">Every day by 10:00 PM Eastern: a four-angle inspection video on YouTube, four daily photos, a weight entry, and a tracker update. Daily documentation exists because long gaps create room for avoidance.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The required update is either completed or it is not.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">05<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Progress and Milestones<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">Daily weigh-ins in the public tracker and documented milestone weigh-ins at 300, 275, 250, 225, 200, and 175 pounds track whether the project is actually working. Weight fluctuation is recorded as progress information — only missing or false documentation is a violation.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">The weight loss itself is conducted under a physician's care, at a sustainable rate. The project enforces documentation — the medicine is supervised separately.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The record is based on visible documentation and measurable results — not motivation, explanations, or intentions.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">06<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Missed Requirements and Consequences<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">Missed requirements are documented publicly. If I fail to meet a requirement, the miss is recorded permanently in the public Violation Log — the date, the nature of the failure, and whether it is resolved. The consequence itself is administered privately by the Accountability Partner under the signed Penalty Schedule; amounts, terms, and details are never published. Accountability without consequence is just commentary.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The purpose is not drama. The purpose is enforcement.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">07<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">The Public Record<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">This website is the official public record of the project. Posts, updates, photos, weigh-ins, missed requirements, and penalties are part of the record. It exists to prevent quiet abandonment, hidden failure, or selective documentation.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The record begins here and continues until the goal is reached.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 56px 0; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 14px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">08<\u002Fspan>\n            <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 28px; text-transform: uppercase; margin: 0;\">Why the Record Is Permanent<\u002Fh2>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">A record I could delete later is not a record — it is a draft. If an exit existed, every hard day would point toward it: quit, clean up, pretend it never happened. Permanence closes that door. Quitting no longer erases anything, so the only version of the future where these photos end well is the one where the later photos show 175.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">That is why the record is deliberately built to operate without my cooperation. It is administered by the Accountability Partner, not by me. It is mirrored across independent archives — this website, the public tracker, YouTube, and a public photo archive — each with its own copy, none of which I control. It is indexed by search engines under my real name, on purpose, so it can be found by anyone who looks. I cannot soften it, edit it, or take it down, and any attempt to would itself become part of the record.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65;\">Maximum exposure is not a side effect. It is the mechanism. The more findable this record is, the more it costs to abandon — and the more the only way out is through.<\u002Fp>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; font-weight: 600;\">The archive cannot be edited. The next photo can.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Questions, answered plainly<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 0; border: 1px solid #141412; max-width: 860px;\">\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">Is this real?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">Yes. Real name, real face, real signed agreement, daily since July 20, 2026. Every claim on this site is verifiable against the public tracker, the photo archive, and the YouTube channel.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">Is this voluntary?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">Entirely. I designed this system, asked for it in writing, and signed it — precisely because voluntary private promises kept failing. The Accountability Partner administers the structure; he did not impose it.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">What happens if he misses a requirement?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">A Violation Event is entered permanently in the public log: the date, the nature of the documentation failure, and its status — resolved or unresolved. The consequence itself is administered privately by the Accountability Partner under the signed agreement; no amounts, terms, or details are published. The entry stays forever.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">Can he delete this site or quietly quit?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">No. The website, domain, trackers, and violation log are owned and administered by the Accountability Partner for the project's duration. Thirty days of silence or any attempt to take the record down converts the site to a permanent public abandonment record.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">Is the weight loss medically supervised?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">Yes — the weight loss proceeds under a physician's care at a sustainable rate. The project enforces documentation, not medicine. Violations are documentation failures; ordinary weight fluctuation is never a violation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">When does it end?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">One way: 175 pounds, held for 28 consecutive days under the verification standard. Then the site converts to a permanent completion record. There is no other ending that isn't public.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 24px 28px; display: flex; flex-direction: column; gap: 8px;\">\n            <span style=\"font-size: 17px; font-weight: 600;\">I know him personally. What now?<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">Then you're part of how this works. Recognition is not a risk of this project — it's the mechanism. Questions and reports go to <a href=\"mailto:ap@michealrayberry.com\" style=\"color: #141412; font-weight: 600;\" style-hover=\"color: #B3261E;\">ap@michealrayberry.com<\u002Fa>, answered by the Accountability Partner, not by Micheal.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 48px 32px; background: #F1F0EA;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; font-family: 'IBM Plex Mono', monospace; font-size: 15px; letter-spacing: 0.06em;\">\n        <span>— Signed, <\u002Fspan><span style=\"font-weight: 700;\">Micheal Ray Berry<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== AGREEMENT ==================== -->\n  <sc-if value=\"{{ isAgreement }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Agreement\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 64px; align-items: start;\">\n        <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n          <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0;\">Binding document — effective upon execution · Day 1: July 20, 2026<\u002Fp>\n          <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0;\">Public Accountability Agreement<\u002Fh1>\n          <div style=\"display: flex; flex-direction: column; gap: 16px; font-size: 17px; line-height: 1.65; max-width: 560px;\">\n            <p style=\"margin: 0;\">The agreement is the governing document of this project. It defines the daily requirements, the documentation standard, the weight-loss schedule, and the consequences that apply when a requirement is missed.<\u002Fp>\n            <p style=\"margin: 0;\">What follows is the public summary, and below it the full text, of the executed agreement as amended. The only confidential part is the Penalty Schedule appendix (§8), held by the Accountability Partner in the signed private edition — consequences are administered privately. The remainder is published here in full for public verification.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #141412; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px; max-width: 560px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Covered by the agreement<\u002Fspan>\n            <ul style=\"margin: 0; padding-left: 20px; font-size: 16px; line-height: 1.7; display: flex; flex-direction: column; gap: 6px;\">\n              <li>Daily Compliance Packet — weight entry, Daily Inspection YouTube Short, four-angle daily photos, and tracker update by 10:00 PM ET<\u002Fli>\n              <li>Standardized uniform, pose, and four-angle documentation format<\u002Fli>\n              <li>Private consequences (§8): every violation is logged publicly by date and nature; the consequence is administered and verified privately by the AP — no amounts, tiers, or details published<\u002Fli>\n              <li>Milestone resets at 300 / 275 / 250 / 225 / 200 / 175 lbs<\u002Fli>\n              <li>Permanent public record, abandonment terms, and website ownership rules<\u002Fli>\n            <\u002Ful>\n          <\u002Fdiv>\n          <p style=\"margin: 0; font-size: 15px; color: #6B6A64; max-width: 560px;\">Violations are documentation failures — missed, late, false, or concealed records. Ordinary weight fluctuation, plateaus, or temporary gains are progress information, never violations.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"width: 100%; aspect-ratio: 3 / 4; border: 1px solid #141412;\">\n            <img data-photo-src=\"https://static.wixstatic.com/media/512909_60b3f90967d340e1973ede1418e4395e~mv2.jpg\" alt=\"Micheal Ray Berry holding the signed agreement, July 20, 2026\" style=\"width: 100%; height: 100%; object-fit: cover; display: block;\">\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">Fig. 1 — Holding the executed agreement, July 20, 2026.<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px; background: #F1F0EA;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 24px;\">\n        <div style=\"background: #141412; color: #FAFAF7; padding: 32px 36px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">On completion<\u002Fspan>\n          <span style=\"font-size: 20px; font-weight: 600;\">The record ends in daylight too.<\u002Fspan>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #D8D6CF;\">When 175 pounds is held for 28 consecutive days, the project is complete. This website converts to a permanent completion record — the final weigh-in, the full progress grid, the closed Violation Log, and the completion video. The record does not come down in success either. It was built to be seen, and it stays visible both ways.<\u002Fp>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E; margin-top: 16px;\">No quiet exit<\u002Fspan>\n          <span style=\"font-size: 20px; font-weight: 600;\">Ending without completion is permanent and public.<\u002Fspan>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #D8D6CF;\">Thirty consecutive days without required documentation — after written notice and a seven-day opportunity to resume — or any attempt to delete, conceal, or shut down the record — ends the project without completion. The website does not come down. Under the terms of the executed agreement it remains online as a permanent archival record — stating the date the project ended, the last verified weight, and the documented compliance history.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #141412; background: #FAFAF7; padding: 32px 36px; display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Documented exceptions<\u002Fspan>\n          <span style=\"font-size: 20px; font-weight: 600;\">Strict, but not blind.<\u002Fspan>\n          <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: #3A3935;\">A requirement can be excused, replaced late, or completed in equivalent form only through a documented exception — a medical event, a genuine emergency, or a verified failure of a platform or required equipment outside my control — reported to the Accountability Partner within 24 hours and supported by proof. Avoidable technical problems, travel, and scheduling conflicts excuse nothing.<\u002Fp>\n          <p style=\"margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">The Accountability Partner administers this record and is not publicly named.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- Full text of the public agreement -->\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 88px;\">\n      <div style=\"max-width: 880px; margin: 0 auto 0 0; display: flex; flex-direction: column; gap: 28px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0;\">Full text — published for verification<\u002Fp>\n          <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">The Agreement, in full<\u002Fh2>\n          <p style=\"margin: 0; font-size: 16px; line-height: 1.65; color: #3A3935; max-width: 640px;\">The complete public edition, verbatim, as amended. Only Appendix A — the Penalty Schedule's dollar amounts — is omitted, as required by §8.2; consequence levels and statuses are public.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"border: 1px solid #141412; padding: 40px 44px; display: flex; flex-direction: column; gap: 18px; font-size: 15px; line-height: 1.7; color: #141412;\">\n          <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 24px; font-size: 14px; border: 1px solid #141412; padding: 16px 18px;\">\n            <div><strong>Participant:<\u002Fstrong> Micheal Ray Berry<\u002Fdiv>\n            <div><strong>Accountability Partner:<\u002Fstrong> identified in the signature block, not publicly named<\u002Fdiv>\n            <div><strong>Project Start (Day 1):<\u002Fstrong> July 20, 2026<\u002Fdiv>\n            <div><strong>Starting Weight:<\u002Fstrong> 340.0 lb<\u002Fdiv>\n            <div><strong>Goal Weight:<\u002Fstrong> 175.0 lb<\u002Fdiv>\n            <div><strong>Completion:<\u002Fstrong> 175.0 lb or lower held for 28 consecutive days<\u002Fdiv>\n          <\u002Fdiv>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">1. Purpose and Nature of the Ag
