reement<\u002Fh3>\n          <p style=\"margin: 0;\">This is a voluntary, non-commercial personal accountability agreement. Micheal Ray Berry has determined that private plans left room to delay, restart, and disappear when the record became uncomfortable, and enters this Agreement to remove that escape. The Agreement governs documentation and verification: it makes Micheal Ray Berry's actions visible, measurable, and difficult to quietly abandon. It does not prescribe diet, exercise, or rate of loss, which remain governed by §6.4 (medical care). This Agreement supersedes all earlier drafts, versions, and public announcements.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">2. Definitions<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>Project Day<\u002Fstrong> — each calendar day in the America/New_York time zone, beginning Day 1. <strong>Official Platforms<\u002Fstrong> — the website michealrayberry.com, the YouTube channel @michealrayberry, and the X account @michealrayberry; only records on Official Platforms count toward compliance. <strong>Public Trackers<\u002Fstrong> — the AP-administered Google Drive records comprising the weigh-in log, Violation Log, photo archive, and Updates log, together with the website pages automatically generated or updated from those records. <strong>Daily Compliance Packet<\u002Fstrong> — the four items listed in §3, due every Project Day. <strong>Violation Event<\u002Fstrong> — a documentation failure as defined in §7; weight values are never Violation Events.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">3. The Daily Compliance Packet<\u002Fh3>\n          <p style=\"margin: 0;\">Every Project Day, by 10:00 PM Eastern Time, Micheal Ray Berry shall complete all four items: (1) <strong>Daily Inspection Video<\u002Fstrong> — one standardized inspection video published to the official YouTube channel, recorded with the official Recording Assistant at michealrayberry.com/#record, and only if it is verifiably unavailable an AP-approved equivalent (§4.4); (2) <strong>Daily Accountability Photos<\u002Fstrong> — the standardized four-angle photos (front, left side, rear, right side) from the same session, uploaded to the designated Google Drive folder by 10:00 PM Eastern Time; (3) <strong>Weight Entry<\u002Fstrong> — that day's weight entered into the designated Google Drive weigh-in tracker by 10:00 PM Eastern Time; (4) <strong>Tracker Update<\u002Fstrong> — all other fields assigned to Micheal Ray Berry in the designated Google Drive tracker completed and saved by 10:00 PM Eastern Time. Multiple missed items on the same Project Day constitute one Violation Event. Timely entry or upload to the designated Google Drive location constitutes completion of the applicable requirement; Google Drive timestamps and revision history are authoritative evidence of timely submission. A delay or failure in the website's automated publication process does not constitute a Violation Event if the underlying Drive record was complete and timely — in that case the AP shall restore publication without penalty to Micheal Ray Berry.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">4. Documentation Standard<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>4.1 Uniform.<\u002Fstrong> All official documentation is recorded in the project uniform: solid black unitard and plain black shoes. Identity is established by Micheal Ray Berry's visible face and the Official Platforms. <strong>4.2 Pose and angles.<\u002Fstrong> Standing upright, hands behind head, body and face visible. Each Daily Inspection documents front, left side, rear, and right side views, closing on a front view. A normal Daily Inspection runs approximately 20–60 seconds; no specific length is required if identity, attire, pose, angles, and visibility are clear. <strong>4.3 No concealment.<\u002Fstrong> No cropping, filters, props, lighting, editing, clothing alteration, camera angle, timing, or platform setting intended to conceal body size, identity, attire, weight status, or compliance. The same standards apply to the daily photos. <strong>4.4 Capture instrument.<\u002Fstrong> All Daily Inspection documentation — the inspection video and the four daily photos — shall be captured using the official Recording Assistant at michealrayberry.com/#record, which enforces the standardized sequence, pose, angles, and on-record overlay. An AP-approved equivalent may be used only when the Recording Assistant is verifiably unavailable; such an outage is handled under §9 and is not a Violation Event.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">5. Official Weigh-Ins and Reviews<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>5.1<\u002Fstrong> An Official Weigh-In is conducted only to verify a milestone (§6.1) or the completion period (§6.3): on camera, on the same scale, under the full §4 standard. Daily weight entries under §3 are self-reported and serve as progress information. <strong>5.2<\u002Fstrong> A monthly progress review is published to the Updates log by the AP.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">6. Milestones, Completion, and Health<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>6.1 Milestones:<\u002Fstrong> 300 · 275 · 250 · 225 · 200 · 175 lb. A milestone counts only when documented by an Official Weigh-In and a milestone video. <strong>6.2 Reset.<\u002Fstrong> Each documented milestone resets the accumulated Violation Event count to zero for future violations. Consequences already assessed remain in effect unless expressly waived in a signed written amendment. <strong>6.3 Completion.<\u002Fstrong> The completion period begins with an Official Weigh-In documenting 175.0 lb or lower. During the following 27 calendar days, Micheal Ray Berry shall record a daily weight entry on the same designated scale. Completion occurs after 28 consecutive calendar days in which every recorded daily weight is 175.0 lb or lower, followed by a second Official Weigh-In on Day 28 confirming 175.0 lb or lower. A missing daily entry interrupts the completion period unless excused under §9; a weight above 175.0 lb restarts it. On verified completion the website converts to a permanent completion record and all obligations under §3 end. <strong>6.4 Medical care and safety override.<\u002Fstrong> The weight loss is conducted under a physician's care at a sustainable rate. Documented medical advice supersedes every documentation requirement in this Agreement. On written medical advice, the AP shall pause any or all requirements without penalty; the pause and its dates are noted in the public record without medical detail.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">7. Violation Events<\u002Fh3>\n          <p style=\"margin: 0;\">A Violation Event is exclusively a documentation failure: a required record that is missed, late, incomplete, false, manipulated, concealed, deleted, or refused, including failure to complete an assigned consequence under §8. Ordinary weight fluctuation, plateaus, or temporary gains are progress information and are never Violation Events. The AP determines whether a Violation Event occurred by applying the written requirements of this Agreement to available timestamps, recordings, tracker records, and other objective evidence, and shall provide Micheal Ray Berry a written notice identifying the failed requirement and supporting evidence. Micheal Ray Berry may submit evidence of compliance or a documented exception within 48 hours; after reviewing it, the AP issues a final written determination. Disagreement, embarrassment, regret, or dissatisfaction with a requirement is not grounds to reverse a properly documented determination.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">8. Consequences — Private Administration<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>8.1<\u002Fstrong> Each qualifying Violation Event triggers a consequence under the separate signed Penalty Schedule, administered and verified privately by the Accountability Partner. A completed consequence does not erase the underlying Violation Event. A weekly weight gain may trigger a consequence only after review by the AP. <strong>8.2 Confidentiality.<\u002Fstrong> The nature, amount, terms, deadlines, receipts, footage, and all communications concerning any consequence remain permanently confidential between the parties and shall not be published on any platform. <strong>8.3 The Violation Log<\u002Fstrong> — the AP-administered public record — states for each Violation Event only: its date, the nature of the documentation failure, and whether it is resolved or unresolved. Public log entries are permanent; corrections are appended, never substituted.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">9. Documented Exceptions<\u002Fh3>\n          <p style=\"margin: 0;\">A requirement may be excused or postponed only because of a documented medical event, a genuine emergency, a verified failure of an Official Platform, or a verified failure of required Project equipment or systems (the designated scale, the Recording Assistant, camera, or archive) outside Micheal Ray Berry's reasonable control, reported to the AP as soon as reasonably possible and ordinarily within 24 hours, supported by reasonable proof. When the interruption ends, the AP designates one outcome: (a) the requirement is excused, where later completion would be impossible, medically inappropriate, or misleading; (b) the requirement is completed within 24 hours as a clearly labeled late replacement record; or (c) an equivalent record is completed within 24 hours. Travel, ordinary work demands, scheduling conflicts, embarrassment, lack of preparation, or avoidable technical problems are not documented exceptions. The public log identifies an accepted exception without disclosing private medical details.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">10. The Public Record and Platform Control<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>10.1 Platform administration and access.<\u002Fstrong> The AP administers michealrayberry.com, the Public Trackers, the photo archive, the Violation Log, and their access permissions. Micheal Ray Berry may access and edit only the designated Google Drive fields and folders required to complete the Daily Compliance Packet. He may not edit, soften, delete, overwrite, or restrict previously published records, violation entries, AP-controlled fields, or archival materials, and shall not seek broader administrative access enabling him to do so. <strong>10.1a Administrative continuity.<\u002Fstrong> The AP shall maintain current backups and secure recovery credentials for all AP-administered Project systems (the website, the michealrayberry.com domain, the Public Trackers, and the photo archive). This does not include, and confers no recovery access to, Micheal Ray Berry's personal YouTube or X accounts. Recovery access may be deposited with a mutually approved neutral person or secure credential-management service and may be used only if the AP is unavailable, incapacitated, resigns, or fails to maintain the systems. Recovery access is never exercised by Micheal Ray Berry, and its use may not alter or suppress an accurate Project record. <strong>10.1b Submission-only role.<\u002Fstrong> Micheal Ray Berry holds no ownership, administrative, hosting, domain-registrar, billing, or configuration control over the website michealrayberry.com, its hosting account, the michealrayberry.com domain, or the Public Trackers, all of which are owned and administered solely by the AP for the Project's duration (§13). He retains ownership of his personal Official-Platform accounts used to publish the record — the YouTube channel @michealrayberry and the X account @michealrayberry — under §10.2; posting to those accounts is his own compliance act and his role, not the AP's. His role as to the AP-administered platform is limited to submission: recording and submitting the Daily Compliance Packet and his personal journal entries. Control of the domain alone does not satisfy this section; the AP's control extends to every layer capable of altering, removing, or restricting the AP-administered record. <strong>10.2<\u002Fstrong> Micheal Ray Berry retains his personal accounts (including the YouTube channel); publishing the daily video is itself a compliance act under §3. <strong>10.2a Authorized republication.<\u002Fstrong> The AP may repost public Project records to Official Platforms, official Project-controlled social-media accounts, AP-controlled Project accounts and websites that do not publicly identify the AP (unless the AP voluntarily chooses to identify themselves), and reasonable archival mirrors used to preserve or promote the Project. Reposted material remains substantially unaltered, accompanied only by factual, nonsexual Project context. The AP may not license, sell, monetize, materially alter, or provide Project content to humiliation, fetish, adult, harassment, or impersonation accounts. No repost may disclose confidential consequence information (§8.2), private contact or employment information, location data beyond the city already public, or information unrelated to the Project. The AP may remove, relocate, or restrict a repost when reasonably necessary to address harassment, impersonation, doxxing, platform-policy violations, legal requirements, or a credible safety concern, preserving the underlying record in an appropriate archive. <strong>10.3 Archival permanence.<\u002Fstrong> The Project maintains a permanent, accurate archival record of material compliance events, milestone results, completion, or termination; it survives this Agreement and remains online indefinitely. The parties are not required to preserve every duplicate post, mirror, social-media upload, or obsolete platform account. Content may be removed, relocated, redacted, or replaced when reasonably necessary because of account compromise, harassment, impersonation, accidental disclosure of private information, platform requirements, legal obligations, cybersecurity concerns, or credible personal-safety concerns — preserving the truth and continuity of the record to the greatest reasonable extent. Nothing in this section authorizes either party to falsify results, conceal an unresolved Violation Event, or falsely represent that the Project was completed. <strong>10.4 Content standard.<\u002Fstrong> Every part of the public record is and remains safe-for-work: the project uniform provides full coverage, and no recording, photo, repost, or log entry may contain explicit, sexualized, or degrading material. Documentation of the body in the project uniform under the §4 standard is not degrading material. Content violating this standard may not be published by either party. If discovered, it is removed and, where reasonably possible, replaced with compliant documentation; such removal is permitted under §10.3 and does not authorize alteration or suppression of an otherwise accurate Project record.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">11. Termination Without Completion<\u002Fh3>\n          <p style=\"margin: 0;\">Thirty consecutive Project Days without required documentation, or any attempt by Micheal Ray Berry to delete, conceal, disable, or shut down the public record, creates a presumption that the Project has ended without completion. Before recording termination, the AP provides written notice and a seven-calendar-day opportunity to resume documentation, establish a documented exception (§9), or execute a mutual termination (§12.4). If the Project ends without completion, the website retains a neutral permanent archival entry stating that the Project ended without verified completion on the stated date and the last verified weight, and may include an accurate summary of documented compliance history. The entry may not use insulting, degrading, speculative, or punitive language. Consequences already assessed under §8 remain in effect.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">12. General Terms<\u002Fh3>\n          <p style=\"margin: 0;\"><strong>12.1 Amendments<\u002Fstrong> only by written instrument signed by both parties; each amendment is noted in the public Updates log by title and date. <strong>12.2 AP privacy.<\u002Fstrong> The AP is not publicly named. Public contact routes to ap@michealrayberry.com. <strong>12.3 Good faith.<\u002Fstrong> Both parties shall act in good faith toward the Project's purpose: a truthful, complete, permanent public record. If any provision is found unenforceable, the remainder stands. <strong>12.4 Voluntary participation.<\u002Fstrong> Micheal Ray Berry may be released from this Agreement only by completion (§6.3), by signed mutual termination noted in the public record, or by termination without completion (§11) with its stated permanent effects.<\u002Fp>\n          <h3 style=\"font-size: 17px; text-transform: uppercase; letter-spacing: 0.04em; margin: 12px 0 0; border-bottom: 1px solid #D8D6CF; padding-bottom: 4px;\">13. Acknowledgment and Execution<\u002Fh3>\n          <p style=\"margin: 0;\">I, Micheal Ray Berry, have read every section of this Agreement and I understand exactly what I am signing. I understand that the record it creates is public, permanent, and attached to my real name and my real face — and that I may not edit, soften, suppress, or remove it because of embarrassment, regret, dissatisfaction, or loss of motivation — content may be removed, relocated, redacted, or replaced only under the limited circumstances expressly permitted by §10.3. I understand that the record is deliberately distributed, mirrored, and indexed by search engines under my name to make it as findable as possible, and I accept that anyone — including friends, family, coworkers, and employers, present and future — may find it. I understand that there are only three ways out: I finish, both parties release me in writing, or the Project ends without completion and that ending stands on the internet under my name forever. I am not signing this in a moment of motivation; I am signing it so that the version of me who loses motivation has no exit. No one has pressured me. This is my own decision, made with a clear mind, and I accept every consequence of it.<\u002Fp>\n          <p style=\"margin: 0;\">The Accountability Partner has read this Agreement in full, accepts the duties of administering the public record fairly and without exception, and agrees to hold the line even — especially — when asked not to.<\u002Fp>\n          <p style=\"margin: 12px 0 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">Effective upon execution by both parties — signatures on the private edition, held by the Accountability Partner. Day 1: July 20, 2026.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <sc-if value=\"{{ hasAmendments }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 56px 32px 72px; background: #F1F0EA;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 16px;\">Amendment log — §12.1<\u002Fp>\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 32px; text-transform: uppercase; margin: 0 0 12px;\">Amendments<\u002Fh2>\n        <p style=\"margin: 0 0 24px; font-size: 15px; color: #3A3935; max-width: 640px;\">This agreement reflects all amendments through {{ amendmentsThrough }}. Every change to the signed agreement is recorded here by date and title.<\u002Fp>\n        <div style=\"border: 1px solid #141412;\">\n          <sc-for list=\"{{ amendments }}\" as=\"am\" hint-placeholder-count=\"1\">\n            <div style=\"display: grid; grid-template-columns: 150px 1fr; gap: 20px; padding: 16px 20px; border-top: 1px solid #D8D6CF; font-size: 15px; line-height: 1.6;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; color: #6B6A64;\">{{ am.date }}<\u002Fspan>\n              <span><strong>{{ am.title }}<\u002Fstrong> — {{ am.summary }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== PENALTIES ==================== -->\n  <sc-if value=\"{{ isPenalties }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Penalties\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 56px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 20px;\">Permanent archival record — corrections are appended and material events remain documented<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0 0 32px;\">Violation Log<\u002Fh1>\n        <div style=\"max-width: 640px; display: flex; flex-direction: column; gap: 16px; font-size: 18px; line-height: 1.65;\">\n          <p style=\"margin: 0;\">This is the permanent public record of all Violation Events.<\u002Fp>\n          <p style=\"margin: 0;\">A violation is a documentation failure — a missed, late, incomplete, false, manipulated, concealed, deleted, or refused record. Ordinary weight fluctuation, plateaus, or temporary gains are never violations; a weekly weight gain can draw a corrective consequence only after review by the Accountability Partner (Amendment No. 2).<\u002Fp>\n          <p style=\"margin: 0;\">All entries remain visible for the duration of the project. Accountability without consequence is just commentary.<\u002Fp>\n        <\u002Fdiv>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 0; border: 1px solid #141412; margin-top: 48px;\">\n          <div style=\"padding: 28px 28px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #D8D6CF;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Every violation triggers<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">A Private Consequence<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">Each qualifying Violation Event triggers a consequence under the signed Penalty Schedule, administered and verified privately by the Accountability Partner (§8). Amounts, terms, and details are never published. A completed consequence does not erase the violation.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 28px; display: flex; flex-direction: column; gap: 10px; border-right: 1px solid #D8D6CF;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">The public record<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">Date · Violation · Status<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">Each entry shows the date, the nature of the documentation failure, and whether it is <em>resolved<\u002Fem> or <em>unresolved<\u002Fem>. Nothing else is published. The entry is permanent — resolution closes the obligation; it never erases the record.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding: 28px 28px; display: flex; flex-direction: column; gap: 10px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Milestone resets<\u002Fspan>\n            <span style=\"font-size: 18px; font-weight: 600;\">300 · 275 · 250 · 225 · 200 · 175<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">A milestone — documented by an official weigh-in and a milestone video — resets the violation count to zero for future violations. Consequences already assessed stay active unless expressly waived in a signed written amendment.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    \n\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Violation Log<\u002Fh2>\n        <div style=\"border: 1px solid #141412;\">\n          <div style=\"display: grid; grid-template-columns: 50px 1fr 3fr 1fr; background: #141412; color: #FAFAF7; font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 12px 20px; gap: 14px;\">\n            <span>No.<\u002Fspan>\n            <span>Date<\u002Fspan>\n            <span>Violation<\u002Fspan>\n            <span>Status<\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPenalties }}\" hint-placeholder-val=\"{{ false }}\">\n            <sc-for list=\"{{ penaltyRows }}\" as=\"pen\" hint-placeholder-count=\"1\">\n              <div style=\"display: grid; grid-template-columns: 50px 1fr 3fr 1fr; font-family: 'IBM Plex Mono', monospace; font-size: 14px; padding: 14px 20px; gap: 14px; border-top: 1px solid #D8D6CF;\">\n                <span style=\"color: #B3261E; font-weight: 600;\">{{ pen.num }}<\u002Fspan>\n                <span>{{ pen.date }}<\u002Fspan>\n                <span>{{ pen.violation }}<\u002Fspan>\n                <span style=\"font-weight: 600; color: {{ pen.statusColor }};\">{{ pen.status }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noPenalties }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding: 48px 20px; border-top: 1px solid #D8D6CF; display: flex; flex-direction: column; align-items: center; gap: 8px;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;\">No violations recorded<\u002Fspan>\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64; white-space: nowrap;\">The record is clean as of Day {{ dayNumber }}.<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== UNIFORM ==================== -->\n  <sc-if value=\"{{ isUniform }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Uniform\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 64px; align-items: start;\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <div style=\"width: 100%; aspect-ratio: 9 / 16; max-height: 560px; border: 1px solid #141412; background: #F1F0EA; overflow: hidden; display: flex; align-items: center; justify-content: center;\">\n            <img data-photo-src=\"https://static.wixstatic.com/media/512909_30b0842754344a4ebf933f91809e2c85~mv2.jpg\" alt=\"Official Day 1 documentation photograph, front view — July 20, 2026\" style=\"width: 100%; height: 100%; object-fit: contain; display: block;\">\n          <\u002Fdiv>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64;\">Fig. 2 — The official Day 1 documentation photograph, front view · July 20, 2026.<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; flex-direction: column; gap: 28px;\">\n          <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0;\">Required standard — all official content<\u002Fp>\n          <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0;\">Project Uniform<\u002Fh1>\n          <p style=\"margin: 0; font-size: 17px; line-height: 1.65; max-width: 560px;\">All official project content must show Micheal Ray Berry under the same conditions each time — clearly identified, visually inspected, and publicly documented.<\u002Fp>\n\n          <div style=\"border: 1px solid #141412;\">\n            <div style=\"padding: 24px 28px; border-bottom: 1px solid #D8D6CF; display: flex; flex-direction: column; gap: 8px;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Requirement 1<\u002Fspan>\n              <span style=\"font-size: 20px; font-weight: 600;\">Black full-body unitard<\u002Fspan>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">Creates a consistent visual baseline. Prevents ordinary clothing from hiding or changing the appearance of the body over time. Its purpose is not fashion. Its purpose is documentation.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"padding: 24px 28px; display: flex; flex-direction: column; gap: 8px;\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Requirement 2<\u002Fspan>\n              <span style=\"font-size: 20px; font-weight: 600;\">Plain black shoes<\u002Fspan>\n              <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">Required for all official full-body documentation. They complete the project uniform and ensure each inspection presents the same full-body visual standard from head to toe.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"border: 1px solid #141412; padding: 24px 28px; display: flex; flex-direction: column; gap: 10px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B6A64;\">Required pose and angles<\u002Fspan>\n            <p style=\"margin: 0; font-size: 15px; line-height: 1.6; color: #3A3935;\">Standing upright, hands behind head, body visible, face visible, no concealment of body shape. Every inspection documents four angles: front, left side, right side, and rear. No cropping, filters, props, lighting, editing, clothing alteration, camera angle, timing, or platform settings intended to hide body size, identity, attire, weight status, or compliance. A normal Daily Inspection runs roughly 20–60 seconds. The same attire, pose, angle, and no-concealment standards apply to the four required daily photos.<\u002Fp>\n          <\u002Fdiv>\n\n          <div style=\"background: #141412; color: #FAFAF7; padding: 24px 28px; font-family: 'IBM Plex Mono', monospace; font-size: 14px; line-height: 2; letter-spacing: 0.06em;\">\n            <span style=\"display: block;\">No anonymous content.<\u002Fspan>\n            <span style=\"display: block;\">No casual documentation.<\u002Fspan>\n            <span style=\"display: block;\">No hidden identity.<\u002Fspan>\n            <span style=\"display: block;\">No inconsistent visual record.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ==================== UPDATES ==================== -->\n  <sc-if value=\"{{ isUpdates }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Updates\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 72px 32px 56px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 20px;\">Chronological — newest first<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0;\">Updates<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 880px; margin: 0 auto 0 0; display: flex; flex-direction: column; gap: 20px;\">\n\n        <sc-for list=\"{{ updateRows }}\" as=\"up\" hint-placeholder-count=\"1\">\n          <div style=\"border: 1px solid {{ up.borderColor }}; background: {{ up.bg }}; padding: 32px 36px; display: flex; flex-direction: column; gap: 14px;\">\n            <sc-if value=\"{{ up.isPersonal }}\" hint-placeholder-val=\"{{ false }}\">\n              <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: #6B6A64; border: 1px solid #D8D6CF; padding: 4px 10px; align-self: flex-start;\">Personal note — not part of the official record<\u002Fspan>\n            <\u002Fsc-if>\n            <div style=\"display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;\">\n              <span style=\"font-weight: 700; color: {{ up.titleColor }};\">{{ up.title }}<\u002Fspan>\n              <span style=\"color: #6B6A64;\">{{ up.date }} · {{ up.author }}<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"margin: 0; font-size: 16px; line-height: 1.65; white-space: pre-wrap;\">{{ up.body }}<\u002Fp>\n            <sc-if value=\"{{ up.hasLink }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display: flex; gap: 20px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px;\">\n                <a href=\"{{ up.link }}\" target=\"_blank\">{{ up.linkLabel }}<\u002Fa>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #6B6A64; margin: 4px 0 0;\">Official entries are posted by the Accountability Partner. Personal notes are posted by Micheal Ray Berry and are permanent once submitted. No entry is silently altered or deleted — corrections are appended with a visible date and explanation.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <sc-if value=\"{{ showVideos }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 64px 32px 80px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;\">\n        <h2 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 36px; text-transform: uppercase; margin: 0;\">Daily Inspection Archive<\u002Fh2>\n        <div style=\"position: relative; width: 100%; max-width: 880px; aspect-ratio: 16 / 9; background: #141412;\">\n          <iframe src=\"https://www.youtube.com/embed/videoseries?list=PL0RDxbCGV9dZL0U3vE3v_FMwYutoOFyuu&amp;rel=0\" title=\"Daily inspection playlist\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; border: 0;\" allowfullscreen=\"{{ true }}\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <\u002Fmain>\n\n  <sc-if value=\"{{ isRecord }}\" hint-placeholder-val=\"{{ false }}\">\n  <div data-screen-label=\"Record\">\n    <section style=\"border-bottom: 1px solid #141412; padding: 56px 32px 40px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <p style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.24em; text-transform: uppercase; color: #B3261E; margin: 0 0 20px;\">One session — inspection video + four daily photos<\u002Fp>\n        <h1 style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: clamp(44px, 6vw, 76px); text-transform: uppercase; line-height: 1; margin: 0 0 32px;\">Recording Assistant<\u002Fh1>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <section style=\"border-bottom: 1px solid #141412; padding: 0 32px;\">\n      <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-wrap: wrap;\">\n        <button sc-camel-on-click=\"{{ toolDaily }}\" style=\"padding: 16px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; border-right: 1px solid #141412; background: {{ tdBg }}; color: {{ tdFg }};\">Daily Inspection<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toolTraining }}\" style=\"padding: 16px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; border-right: 1px solid #141412; background: {{ ttBg }}; color: {{ ttFg }};\">Training Session<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toolAck }}\" style=\"padding: 16px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; border-right: 1px solid #141412; background: {{ taBg }}; color: {{ taFg }};\">Violation Acknowledgment<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ toolCorr }}\" style=\"padding: 16px 22px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; border: none; border-right: 1px solid #141412; background: {{ tcBg }}; color: {{ tcFg }};\">Corrective Session<\u002Fbutton>\n              <\u002Fdiv>\n    <\u002Fsection>\n    <sc-if value=\"{{ isToolDaily }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"border-bottom: 1px solid #141412;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <x-import component-from-global-scope=\"recording-assistant\" from=\"dc095677-b71e-4b0e-9596-7b8764e21930#/recording-assistant.js\" hint-size=\"100%,700px\"><\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isToolTraining }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"border-bottom: 1px solid #141412;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <dc-import name=\"Public Training Session\" hint-size=\"100%,1100px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isToolAck }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"border-bottom: 1px solid #141412; background: #F1F0EA;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <dc-import name=\"Violation Acknowledgment\" hint-size=\"100%,1000px\"><\u002Fdc-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ isToolCorr }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"border-bottom: 1px solid #141412;\">\n      <div style=\"max-width: 1160px; margin: 0 auto;\">\n        <x-import component-from-global-scope=\"recording-assistant\" from=\"dc095677-b71e-4b0e-9596-7b8764e21930#/recording-assistant.js\" mode=\"corrective\" hint-size=\"100%,700px\"><\u002Fx-import>\n      <\u002Fdiv>\n    <\u002Fsection>\n    <\u002Fsc-if>\n      <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <!-- ============ FOOTER ============ -->\n  <footer style=\"background: #141412; color: #FAFAF7; padding: 56px 32px 40px;\">\n    <div style=\"max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px;\">\n      <div style=\"display: flex; justify-content: space-between; gap: 32px; flex-wrap: wrap;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <span style=\"font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.04em; text-transform: uppercase;\">Micheal Ray Berry<\u002Fspan>\n          <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase; color: #8A8983;\">Public Accountability Project<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 40px; flex-wrap: wrap;\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: #B3261E;\">Official record<\u002Fspan>\n            <div style=\"display: flex; gap: 20px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase;\">\n              <a href=\"https://michealrayberry.com\" style=\"color: #FAFAF7;\" style-hover=\"color: #B3261E;\">Website<\u002Fa>\n              <a href=\"https://youtube.com/@michealrayberry\" target=\"_blank\" style=\"color: #FAFAF7;\" style-hover=\"color: #B3261E;\">YouTube<\u002Fa>\n              <a href=\"https://x.com/michealrayberry\" target=\"_blank\" style=\"color: #FAFAF7;\" style-hover=\"color: #B3261E;\">X<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n                  <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top: 1px solid #3A3935; padding-top: 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #8A8983;\">\n        <span style=\"display: flex; gap: 6px 20px; flex-wrap: wrap;\"><span style=\"white-space: nowrap;\">Accountability Partner: <a href=\"mailto:ap@michealrayberry.com\" style=\"color: #FAFAF7;\" style-hover=\"color: #B3261E;\">ap@michealrayberry.com<\u002Fa><\u002Fspan><span style=\"white-space: nowrap;\">Micheal Ray Berry: <a href=\"mailto:contact@michealrayberry.com\" style=\"color: #FAFAF7;\" style-hover=\"color: #B3261E;\">contact@michealrayberry.com<\u002Fa><\u002Fspan><\u002Fspan>\n        <span style=\"white-space: nowrap; display: flex; gap: 16px;\"><a href=\"#record\" sc-camel-on-click=\"{{ goRecord }}\" style=\"color: #6B6A64;\" style-hover=\"color: #B3261E;\">Recording Assistant<\u002Fa><span>© 2026 Micheal Ray Berry<\u002Fspan><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;startWeight&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 340, &quot;tsType&quot;: &quot;number&quot;, &quot;unit&quot;: &quot;lbs&quot;, &quot;min&quot;: 100, &quot;max&quot;: 500, &quot;section&quot;: &quot;Project terms&quot; },\n  &quot;goalWeight&quot;: { &quot;editor&quot;: &quot;int&quot;, &quot;default&quot;: 175, &quot;tsType&quot;: &quot;number&quot;, &quot;unit&quot;: &quot;lbs&quot;, &quot;min&quot;: 100, &quot;max&quot;: 300, &quot;section&quot;: &quot;Project terms&quot; },\n  &quot;showVideos&quot;: { &quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Content&quot; }\n}\">\n// Accepts any pasted Google Drive share link and converts it to a direct\n// image URL, so the AP can right-click → copy link without special formats.\nfunction normalizeDriveUrl(url) {\n  const m = url.match(/drive\\.google\\.com\\/(?:file\\/d\\/|open\\?id=|thumbnail\\?id=|uc\\?id=)([\\w-]+)/);\n  if (m) return 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w1200';\n  return url;\n}\n\nclass Component extends DCLogic {\n  state = { page: 'home', liveWeighIns: null, livePenalties: null, liveUpdates: null, liveJournal: null, liveAmendments: null, expandedDay: null, subMsg: '', subOk: true };\n\n  // Subscribe endpoint: the AP's Apps Script web app URL (ends in /exec).\n  // Empty string = form shows \"not yet activated\". See apps-script/Code.gs for setup.\n  SUBSCRIBE_ENDPOINT = 'https://script.google.com/macros/s/AKfycbz9drhPe0Jn6ptytde5Ut3wZlxbIll5nYv3Z5-JF5thkt1__wfzzyjyJjs0lT2VQlcnWg/exec';\n\n  // Official public tracker sheets (AP-administered). Read-only CSV endpoints; no key needed.\n  // All record tabs live in ONE AP-administered spreadsheet; each CSV endpoint\n  // targets its tab by gid.\n  WEIGHINS_CSV = 'https://docs.google.com/spreadsheets/d/1wmyPT0vfuHrZfoTnnkIOsr7lHKNlr7Kro8L8dNxUkNM/gviz/tq?tqx=out:csv&gid=1146060827';\n  PENALTIES_CSV = 'https://docs.google.com/spreadsheets/d/1wmyPT0vfuHrZfoTnnkIOsr7lHKNlr7Kro8L8dNxUkNM/gviz/tq?tqx=out:csv&gid=1365599185';\n  // Updates sheet (AP-administered). Columns: date · type ('official'|'personal') · title · body · link.\n  // AP posts official entries directly; Micheal's journal form appends personal rows. Set after the AP creates it:\n  UPDATES_CSV = 'https://docs.google.com/spreadsheets/d/1wmyPT0vfuHrZfoTnnkIOsr7lHKNlr7Kro8L8dNxUkNM/gviz/tq?tqx=out:csv&gid=742923954';\n  // Micheal's journal form responses (Timestamp · Title · Note). Permanent once submitted.\n  JOURNAL_CSV = 'https://docs.google.com/spreadsheets/d/1wmyPT0vfuHrZfoTnnkIOsr7lHKNlr7Kro8L8dNxUkNM/gviz/tq?tqx=out:csv&gid=482638063';\n  // Amendments log (AP-administered). Columns: date · title · summary · link. Public\n  // change history of the SIGNED agreement (§12.1). Empty until the AP creates the\n  // sheet (run createAmendmentsSheet in Apps Script) and pastes its CSV URL here.\n  AMENDMENTS_CSV = 'https://docs.google.com/spreadsheets/d/1wmyPT0vfuHrZfoTnnkIOsr7lHKNlr7Kro8L8dNxUkNM/gviz/tq?tqx=out:csv&gid=413137433';\n\n  parseCSV(text) {\n    // Handles quoted fields with commas; returns array of row arrays.\n    const rows = [];\n    let row = [], field = '', inQ = false;\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i];\n      if (inQ) {\n        if (c === '\"') {\n          if (text[i + 1] === '\"') { field += '\"'; i++; }\n          else inQ = false;\n        } else field += c;\n      } else if (c === '\"') inQ = true;\n      else if (c === ',') { row.push(field); field = ''; }\n      else if (c === '\\n' || c === '\\r') {\n        if (c === '\\r' && text[i + 1] === '\\n') i++;\n        row.push(field); field = '';\n        if (row.some((f) => f.trim() !== '')) rows.push(row);\n        row = [];\n      } else field += c;\n    }\n    row.push(field);\n    if (row.some((f) => f.trim() !== '')) rows.push(row);\n    return rows;\n  }\n\n  // Progress Grid images: src is applied at runtime from data-photo-src so the\n  // dynamic sheet-hosted URLs don't break static bundling.\n  syncPhotoImgs() {\n    document.querySelectorAll('img[data-photo-src]').forEach((el) => {\n      const s = el.getAttribute('data-photo-src');\n      if (s && el.getAttribute('src') !== s) el.setAttribute('src', s);\n    });\n  }\n\n  componentDidUpdate() { this.syncPhotoImgs(); }\n\n  // SEO: inject structured data for every published photo and video so search\n  // engines index each day's media as first-class objects.\n  injectSeoJsonLd(entries) {\n    try {\n      const photos = entries.filter((e) => e.photo);\n      const videos = entries.filter((e) => e.video);\n      const graph = { '@context': 'https://schema.org', '@graph': [] };\n      if (photos.length) {\n        graph['@graph'].push({\n          '@type': 'ItemList',\n          name: 'Micheal Ray Berry daily accountability photos',\n          itemListElement: photos.map((e, i) => ({\n            '@type': 'ListItem',\n            position: i + 1,\n            item: {\n              '@type': 'ImageObject',\n              contentUrl: normalizeDriveUrl(e.photo),\n              name: 'Micheal Ray Berry daily accountability photo — ' + e.date +\n                (isNaN(e.weight) ? '' : ', ' + e.weight.toFixed(1) + ' lb'),\n              description: 'Standardized daily front-view accountability photo from the public weight loss record: 340 to 175 pounds, documented daily at michealrayberry.com.',\n              uploadDate: e.date,\n            },\n          })),\n        });\n      }\n      videos.forEach((e) => {\n        graph['@graph'].push({\n          '@type': 'VideoObject',\n          name: 'Micheal Ray Berry daily inspection video — ' + e.date +\n            (isNaN(e.weight) ? '' : ', ' + e.weight.toFixed(1) + ' lb'),\n          description: 'Guided four-angle daily inspection video from the Micheal Ray Berry Public Accountability Project: 340 to 175 pounds, documented daily.',\n          contentUrl: e.video,\n          thumbnailUrl: e.photo ? normalizeDriveUrl(e.photo) : 'https://static.wixstatic.com/media/512909_30b0842754344a4ebf933f91809e2c85~mv2.jpg',\n          uploadDate: e.date,\n        });\n      });\n      if (!graph['@graph'].length) return;\n      let el = document.getElementById('seo-live-data');\n      if (!el) {\n        el = document.createElement('script');\n        el.type = 'application/ld+json';\n        el.id = 'seo-live-data';\n        document.head.appendChild(el);\n      }\n      el.textContent = JSON.stringify(graph);\n    } catch (e) {}\n  }\n\n  componentDidMount() {\n    this.syncPhotoImgs();\n    try {\n      const openFromHash = () => {\n        if ((window.location.hash || '').toLowerCase().indexOf('record') !== -1) this.setState({ page: 'record' });\n      };\n      openFromHash();\n      window.addEventListener('hashchange', openFromHash);\n      window.addEventListener('popstate', () => this.openDayFromUrl());\n      if ((window.location.search || '').indexOf('day=') !== -1) this.openDayFromUrl();\n    } catch (e) {}\n    fetch(this.WEIGHINS_CSV)\n      .then((r) => (r.ok ? r.text() : null))\n      .then((t) => {\n        if (!t) return;\n        const rows = this.parseCSV(t).slice(1); // drop header\n        const entries = rows\n          .map((r) => ({ date: (r[0] || '').trim(), weight: parseFloat(r[1]), note: (r[2] || '').trim(), photo: (r[3] || '').trim(), left: (r[4] || '').trim(), rear: (r[5] || '').trim(), right: (r[6] || '').trim(), video: (r[7] || '').trim() }))\n          .filter((e) => /^\\d{4}-\\d{2}-\\d{2}$/.test(e.date) && !isNaN(e.weight));\n        if (entries.length) {\n          this.setState({ liveWeighIns: entries });\n          this.injectSeoJsonLd(entries);\n        }\n      })\n      .catch(() => {});\n    if (this.JOURNAL_CSV) {\n      fetch(this.JOURNAL_CSV)\n        .then((r) => (r.ok ? r.text() : null))\n        .then((t) => {\n          if (!t) return;\n          const rows = this.parseCSV(t).slice(1);\n          const entries = rows\n            .map((r) => {\n              const ts = (r[0] || '').trim();\n              const d = new Date(ts);\n              return {\n                date: isNaN(d) ? ts : d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' }),\n                sortTime: isNaN(d) ? 0 : d.getTime(),\n                type: 'personal',\n                title: (r[2] ? (r[1] || '') : '').trim(),\n                body: ((r[2] || r[1]) || '').trim(),\n                link: '',\n              };\n            })\n            .filter((e) => e.body);\n          if (entries.length) this.setState({ liveJournal: entries });\n        })\n        .catch(() => {});\n    }\n    if (this.UPDATES_CSV) {\n      fetch(this.UPDATES_CSV)\n        .then((r) => (r.ok ? r.text() : null))\n        .then((t) => {\n          if (!t) return;\n          const rows = this.parseCSV(t).slice(1);\n          const entries = rows\n            .map((r) => ({\n              date: (r[0] || '').trim(),\n              type: (r[1] || '').trim().toLowerCase(),\n              title: (r[2] || '').trim(),\n              body: (r[3] || '').trim(),\n              link: (r[4] || '').trim(),\n            }))\n            .filter((e) => e.date && (e.title || e.body));\n          if (entries.length) this.setState({ liveUpdates: entries });\n        })\n        .catch(() => {});\n    }\n    if (this.AMENDMENTS_CSV) {\n      fetch(this.AMENDMENTS_CSV)\n        .then((r) => (r.ok ? r.text() : null))\n        .then((t) => {\n          if (!t) return;\n          const rows = this.parseCSV(t).slice(1);\n          const entries = rows\n            .map((r) => ({ date: (r[0] || '').trim(), title: (r[1] || '').trim(), summary: (r[2] || '').trim(), link: (r[3] || '').trim() }))\n            .filter((e) => e.date && (e.title || e.summary));\n          if (entries.length) this.setState({ liveAmendments: entries });\n        })\n        .catch(() => {});\n    }\n    fetch(this.PENALTIES_CSV)\n      .then((r) => (r.ok ? r.text() : null))\n      .then((t) => {\n        if (!t) return;\n        const rows = this.parseCSV(t).slice(1);\n        // Public format (§8): date · violation · status. Legacy 7-column level rows still parse.\n        const entries = rows\n          .map((r) => {\n            const c = r.map((x) => String(x || '').trim());\n            // Public format (§8): date · violation · status. Legacy level-format rows (level in col B) still parse.\n            if (/^level/i.test(c[1])) {\n              return { date: c[0], violation: c[2], status: /satisfied/i.test(c[6] || '') ? 'Resolved' : (c[6] || 'Unresolved') };\n            }\n            return { date: c[0], violation: c[1], status: c[2] || c[3] || 'Unresolved' };\n          })\n          .filter((e) => e.date && e.violation);\n        this.setState({ livePenalties: entries });\n      })\n      .catch(() => {});\n  }\n\n  // ===== THE OFFICIAL WEIGH-IN RECORD =====\n  // Live source: the public \"MRB Accountability — Weigh-ins\" Google Sheet.\n  // The list below is only the offline fallback shown if the sheet is unreachable.\n  weighIns() {\n    if (this.state.liveWeighIns) return this.state.liveWeighIns;\n    return [\n      { date: '2026-07-20', weight: 340.0, note: 'Project start' },\n    ];\n  }\n\n  // ----- Per-day URLs (?day=N): each recorded day is its own indexable URL -----\n  DAY1_ISO = '2026-07-20';\n  dayNumOf(dateStr) {\n    return Math.round((new Date(dateStr + 'T12:00:00') - new Date(this.DAY1_ISO + 'T12:00:00')) / 864e5) + 1;\n  }\n  dateOfDayNum(n) {\n    const d = new Date(this.DAY1_ISO + 'T12:00:00');\n    d.setDate(d.getDate() + (n - 1));\n    return d.toISOString().slice(0, 10);\n  }\n  // Keep title/canonical/description in sync with the open day so each ?day=N\n  // URL presents itself to crawlers as a distinct document.\n  applyDaySeo(dateStr) {\n    try {\n      const canon = document.querySelector('link[rel=\"canonical\"]');\n      const desc = document.querySelector('meta[name=\"description\"]');\n      if (!this._defaultSeo) {\n        this._defaultSeo = {\n          title: document.title,\n          canonical: canon ? canon.href : '',\n          description: desc ? desc.getAttribute('content') : '',\n        };\n      }\n      if (!dateStr) {\n        document.title = this._defaultSeo.title;\n        if (canon) canon.href = this._defaultSeo.canonical;\n        if (desc) desc.setAttribute('content', this._defaultSeo.description);\n        return;\n      }\n      const n = this.dayNumOf(dateStr);\n      const w = this.weighIns().find((x) => x.date === dateStr);\n      const wStr = w && !isNaN(w.weight) ? w.weight.toFixed(1) + ' lb' : '';\n      document.title = 'Day ' + n + (wStr ? ' — ' + wStr : '') + ' — ' + dateStr + ' — Micheal Ray Berry Public Accountability Record';\n      if (canon) canon.href = 'https://michealrayberry.com/?day=' + n;\n      if (desc) desc.setAttribute('content', 'Day ' + n + ' of Micheal Ray Berry\\u2019s public weight-loss accountability record' + (wStr ? ': ' + wStr : '') + ' on ' + dateStr + '. Daily photos from all four angles and the inspection video. 340 to 175 pounds, documented in public.');\n    } catch (e) {}\n  }\n  setDayUrl(dateStr) {\n    try {\n      const url = dateStr ? '?day=' + this.dayNumOf(dateStr) : window.location.pathname;\n      window.history.pushState({ day: dateStr || null }, '', url);\n    } catch (e) {}\n    this.applyDaySeo(dateStr);\n  }\n  openDayFromUrl() {\n    try {\n      const m = (window.location.search || '').match(/[?&]day=(\\d+)/);\n      if (!m) { this.setState({ expandedDay: null }); this.applyDaySeo(null); return; }\n      const dateStr = this.dateOfDayNum(parseInt(m[1], 10));\n      this.setState({ expandedDay: dateStr, page: 'dashboard' });\n      this.applyDaySeo(dateStr);\n    } catch (e) {}\n  }\n\n  go(page) {\n    this.setState({ page });\n    try { if (page === 'record') window.location.hash = 'record'; else if ((window.location.hash || '').toLowerCase().indexOf('record') !== -1) window.location.hash = ''; } catch (e) {}\n    try { window.scrollTo(0, 0); } catch (e) {}\n  }\n\n  renderVals() {\n    const startWeight = this.props.startWeight ?? 340;\n    const goalWeight = this.props.goalWeight ?? 175;\n    const showVideos = this.props.showVideos ?? true;\n    const amendments = (this.state.liveAmendments || []).slice().sort((a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0));\n\n    const START_DATE = new Date(2026, 6, 20); // July 20, 2026 = Day 1\n    const now = new Date();\n    const rawDay = Math.floor((now - START_DATE) / 86400000) + 1;\n    const dayNumber = Math.max(0, rawDay);\n    const dayStatus = rawDay < 1\n      ? 'Project starts in ' + Math.ceil((START_DATE - now) / 86400000) + ' day' + (Math.ceil((START_DATE - now) / 86400000) === 1 ? '' : 's')\n      : 'Day ' + dayNumber + ' of project';\n\n    const data = this.weighIns().slice().sort((a, b) => a.date.localeCompare(b.date));\n    const last = data.length ? data[data.length - 1] : null;\n    const current = last ? last.weight : startWeight;\n    const lost = Math.max(0, startWeight - current);\n    const remaining = Math.max(0, current - goalWeight);\n    const totalToLose = startWeight - goalWeight;\n    const pct = totalToLose > 0 ? Math.min(100, Math.max(0, (lost / totalToLose) * 100)) : 0;\n\n    // ----- Weekly review strip (weeks run Mon-Sun from Day 1) -----\n    const daysSince = Math.floor((Date.now() - new Date('2026-07-20T00:00:00')) / 864e5);\n    const closedWeek = Math.floor(daysSince / 7);\n    let wrClosed = 'Week 1 closes with Day 7.';\n    if (closedWeek >= 1) {\n      const ws = new Date('2026-07-20T12:00:00'); ws.setDate(ws.getDate() + (closedWeek - 1) * 7);\n      const we = new Date(ws); we.setDate(we.getDate() + 6);\n      const iso = (d) => d.toISOString().slice(0, 10);\n      const inWeek = data.filter((r) => r.date >= iso(ws) && r.date <= iso(we) && !isNaN(r.weight));\n      const before = data.filter((r) => r.date < iso(ws) && !isNaN(r.weight));\n      const base = before.length ? before[before.length - 1].weight : (inWeek.length ? inWeek[0].weight : NaN);\n      const endW = inWeek.length ? inWeek[inWeek.length - 1].weight : NaN;\n      if (!isNaN(endW)) {\n        const d = endW - base;\n        wrClosed = 'Week ' + closedWeek + ' closed: ' + base.toFixed(1) + ' → ' + endW.toFixed(1) + ' (' + (d <= 0 ? '−' : '+') + Math.abs(d).toFixed(1) + ' lb)';\n      } else {\n        wrClosed = 'Week ' + closedWeek + ' closed — no recorded entries.';\n      }\n    }\n    const wrCurrent = closedWeek >= 1 ? 'Week ' + (closedWeek + 1) + ' in progress — day ' + ((daysSince % 7) + 1) + ' of 7.' : '';\n\n    const fmt = (n) => (Math.round(n * 10) / 10).toFixed(1);\n    const fmtDate = (iso) => {\n      const [y, m, d] = iso.split('-').map(Number);\n      return new Date(y, m - 1, d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });\n    };\n    const dayOf = (iso) => {\n      const [y, m, d] = iso.split('-').map(Number);\n      return Math.floor((new Date(y, m - 1, d) - START_DATE) / 86400000) + 1;\n    };\n\n    // ----- Chart geometry: x = day, y = weight -----\n    const X0 = 60, X1 = 990, Y0 = 20, Y1 = 300;\n    const W_TOP = 340, W_BOT = 170;\n    const maxDay = Math.max(dayNumber, 28);\n    const xOf = (day) => X0 + ((day - 1) / Math.max(1, maxDay - 1)) * (X1 - X0);\n    const yOf = (w) => Y0 + ((W_TOP - w) / (W_TOP - W_BOT)) * (Y1 - Y0);\n\n    const chartDots = data.map((e) => ({ x: xOf(dayOf(e.date)).toFixed(1), y: yOf(e.weight).toFixed(1) }));\n    const chartPoints = chartDots.map((d) => d.x + ',' + d.y).join(' ');\n\n    // ----- Log rows, newest first -----\n    const logRows = data.slice().reverse().map((e, i, arr) => {\n      const prev = arr[i + 1];\n      const delta = prev ? e.weight - prev.weight : 0;\n      let change = '—', changeColor = '#6B6A64';\n      if (prev) {\n        if (delta < 0) { change = fmt(delta) + ' lbs'; changeColor = '#141412'; }\n        else if (delta > 0) { change = '+' + fmt(delta) + ' lbs'; changeColor = '#B3261E'; }\n        else { change = '±0.0 lbs'; }\n      }\n      return {\n        day: dayOf(e.date) < 1 ? 'PRE' : String(dayOf(e.date)).padStart(2, '0'),\n        date: fmtDate(e.date),\n        weight: fmt(e.weight) + ' lbs',\n        change, changeColor,\n        note: e.note || '',\n      };\n    });\n\n    // ----- Penalties (permanent record) -----\n    // Live source: the public \"MRB Accountability — Penalties\" Google Sheet (AP-administered).\n    // Public columns per §8 of the agreement: date · violation · status ('Unresolved' or 'Resolved · date').\n    // Private consequence details NEVER appear here or in the sheet.\n    const penalties = this.state.livePenalties || [];\n\n    // ----- Updates (official entries by the AP; personal notes by Micheal, permanent once posted) -----\n    const fallbackUpdates = [{\n      date: 'July 20, 2026', type: 'official', title: 'Entry 001 — Project Commencement',\n      body: 'The project begins. Starting weight recorded at 340 pounds. The accountability agreement is signed and published. Daily Inspection videos post to the official YouTube channel; weights post to the public tracker on this record.',\n      link: 'https://youtube.com/@michealrayberry',\n    }];\n    const officials = (this.state.liveUpdates && this.state.liveUpdates.length ? this.state.liveUpdates : fallbackUpdates).slice();\n    const journal = (this.state.liveJournal || []).slice();\n    const rawUpdates = officials.concat(journal).sort((a, b) => {\n      const ta = a.sortTime != null ? a.sortTime : (isNaN(Date.parse(a.date)) ? 0 : Date.parse(a.date));\n      const tb = b.sortTime != null ? b.sortTime : (isNaN(Date.parse(b.date)) ? 0 : Date.parse(b.date));\n      return ta - tb;\n    });\n    let officialCount = 0;\n    const numbered = rawUpdates.map((u) => {\n      const isPersonal = u.type === 'personal';\n      if (!isPersonal) officialCount += 1;\n      return { u, isPersonal, num: isPersonal ? 0 : officialCount };\n    });\n    const updateRows = numbered.reverse().map(({ u, isPersonal, num }) => ({\n      date: u.date,\n      isPersonal,\n      title: isPersonal\n        ? (u.title || 'Personal note')\n        : (u.title.toLowerCase().indexOf('entry') === 0 ? u.title : 'Entry ' + String(num).padStart(3, '0') + ' — ' + u.title),\n      body: u.body,\n      author: isPersonal ? 'by Micheal Ray Berry' : 'by the AP',\n      hasLink: !!u.link,\n      link: u.link,\n      linkLabel: u.link.indexOf('youtu') !== -1 ? 'YouTube' : 'Link',\n      borderColor: isPersonal ? '#D8D6CF' : '#141412',\n      bg: isPersonal ? '#F1F0EA' : '#FAFAF7',\n      titleColor: isPersonal ? '#3A3935' : '#141412',\n    }));\n\n    // ----- Daily progress photos (photo column in the Weigh-ins sheet) -----\n    const START_ISO = '2026-07-20';\n    const etTodayIso = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/New_York' }).format(new Date());\n    const byDate = {};\n    this.weighIns().forEach((w) => { byDate[w.date] = w; });\n    const cells = this.weighIns()\n      .filter((w) => w.photo)\n      .map((w) => ({\n        isMissed: false, isPhoto: true,\n        date: w.date,\n        weight: isNaN(w.weight) ? '' : w.weight.toFixed(1) + ' LB',\n        photo: normalizeDriveUrl(w.photo),\n        href: '?day=' + this.dayNumOf(w.date),\n        select: (e) => {\n          try { e.preventDefault(); } catch (err) {}\n          const next = this.state.expandedDay === w.date ? null : w.date;\n          this.setState({ expandedDay: next });\n          this.setDayUrl(next);\n        },\n        borderColor: this.state.expandedDay === w.date ? '#B3261E' : '#141412',\n      }));\n    // A project day with no record at all renders as a MISSED square — the gap is part of the record.\n    for (let d = new Date(START_ISO + 'T12:00:00'); ; d.setDate(d.getDate() + 1)) {\n      const iso = d.toISOString().slice(0, 10);\n      if (iso >= etTodayIso) break;\n      if (!byDate[iso]) cells.push({ isMissed: true, isPhoto: false, date: iso, weight: '', photo: '' });\n    }\n    const photoRows = cells.sort((a, b) => (a.date < b.date ? -1 : 1)).reverse();\n\n    // Expanded day: all four angles (any missing angle is simply omitted)\n    const expDay = this.state.expandedDay\n      ? this.weighIns().find((w) => w.date === this.state.expandedDay)\n      : null;\n    const expandedAngles = expDay\n      ? [\n          { label: 'FRONT', url: expDay.photo },\n          { label: 'LEFT SIDE', url: expDay.left },\n          { label: 'REAR', url: expDay.rear },\n          { label: 'RIGHT SIDE', url: expDay.right },\n        ].filter((a) => a.url).map((a) => ({ label: a.label, url: normalizeDriveUrl(a.url) }))\n      : [];\n    const penaltyRows = penalties.map((p, i) => ({\n      num: String(i + 1).padStart(3, '0'),\n      date: p.date, violation: p.violation,\n      status: p.status || 'Unresolved',\n      statusColor: /satisfied|resolved/i.test(p.status || '') ? '#3A6B3A' : '#B3261E',\n    }));\n\n    // ----- Milestone ladder (reached when lowest recorded weight crosses) -----\n    const lowest = data.length ? Math.min.apply(null, data.map((e) => e.weight)) : startWeight;\n    const milestoneCells = [300, 275, 250, 225, 200, 175].map((m) => ({\n      label: String(m),\n      tag: lowest <= m ? 'Reached' : (m === 175 ? 'Goal' : 'Ahead'),\n      bg: lowest <= m ? '#141412' : '#FAFAF7',\n      color: lowest <= m ? '#FAFAF7' : (m === 175 ? '#B3261E' : '#141412'),\n    }));\n\n    const page = this.state.page;\n    return {\n      dayNumber,\n      dayStatus,\n      startLabel: fmt(startWeight),\n      currentLabel: fmt(current),\n      goalLabel: fmt(goalWeight),\n      lostLabel: fmt(lost),\n      remainingLabel: fmt(remaining),\n      pctLabel: pct.toFixed(1) + '%',\n      pctWidth: Math.max(0.5, pct) + '%',\n      goalY: yOf(goalWeight).toFixed(1),\n      goalLabelY: (yOf(goalWeight) - 10).toFixed(1),\n      chartPoints, chartDots, logRows, milestoneCells,\n      hasPenalties: penaltyRows.length > 0,\n      noPenalties: penaltyRows.length === 0,\n      penaltyRows,\n      showVideos,\n      isHome: page === 'home',\n      isDashboard: page === 'dashboard',\n      isAbout: page === 'about',\n      isAgreement: page === 'agreement',\n      amendments,\n      hasAmendments: amendments.length > 0,\n      amendmentsThrough: amendments[0] ? amendments[0].date : '',\n      isPenalties: page === 'penalties',\n      isUniform: page === 'uniform',\n      isUpdates: page === 'updates',\n      wrClosed, wrCurrent,\n      isRecord: page === 'record',\n      goRecord: () => this.go('record'),\n      ...(() => {\n        const t = this.state.recordTool || 'daily';\n        const bg = (k) => (t === k ? '#141412' : 'transparent');\n        const fg = (k) => (t === k ? '#FAFAF7' : '#141412');\n        return {\n          isToolDaily: t === 'daily', isToolTraining: t === 'training', isToolAck: t === 'ack', isToolCorr: t === 'corr',\n          toolDaily: () => this.setState({ recordTool: 'daily' }),\n          toolTraining: () => this.setState({ recordTool: 'training' }),\n          toolAck: () => this.setState({ recordTool: 'ack' }),\n          toolCorr: () => this.setState({ recordTool: 'corr' }),\n          tdBg: bg('daily'), tdFg: fg('daily'),\n          ttBg: bg('training'), ttFg: fg('training'),\n          taBg: bg('ack'), taFg: fg('ack'),\n          tcBg: bg('corr'), tcFg: fg('corr'),\n        };\n      })(),\n      subMsg: this.state.subMsg,\n      subMsgColor: this.state.subOk ? '#6B6A64' : '#B3261E',\n      onSubEmail: (e) => { this._subEmail = e.target.value; },\n      onSubscribe: () => {\n        const email = (this._subEmail || '').trim();\n        if (!/^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$/.test(email)) {\n          this.setState({ subMsg: 'Enter a valid email address.', subOk: false });\n          return;\n        }\n        if (!this.SUBSCRIBE_ENDPOINT) {\n          this.setState({ subMsg: 'Subscriptions activate shortly — check back soon.', subOk: false });\n          return;\n        }\n        this.setState({ subMsg: 'Subscribing…', subOk: true });\n        fetch(this.SUBSCRIBE_ENDPOINT, {\n          method: 'POST', mode: 'no-cors',\n          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },\n          body: 'email=' + encodeURIComponent(email),\n        }).then(() => {\n          this.setState({ subMsg: 'Subscribed. You are now a witness to the record.', subOk: true });\n        }).catch(() => {\n          this.setState({ subMsg: 'Could not subscribe — try again later.', subOk: false });\n        });\n      },\n      photoRows,\n      updateRows,\n      hasPhotos: photoRows.some((c) => c.isPhoto),\n      hasExpanded: expandedAngles.length > 0,\n      expandedAngles,\n      expandedDate: expDay ? expDay.date : '',\n      expandedWeight: expDay && !isNaN(expDay.weight) ? expDay.weight.toFixed(1) + ' LB' : '',\n      closeExpanded: () => { this.setState({ expandedDay: null }); this.setDayUrl(null); },\n      goHome: () => this.go('home'),\n      goDashboard: () => this.go('dashboard'),\n      goAbout: () => this.go('about'),\n      goAgreement: () => this.go('agreement'),\n      goPenalties: () => this.go('penalties'),\n      goUniform: () => this.go('uniform'),\n      goUpdates: () => this.go('updates'),\n      goRecord: () => this.go('record'),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
