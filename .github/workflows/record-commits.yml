# Every commit to main is the public history of this record.
# Uploading through the GitHub website is fine — type what changed.
# This check rejects only GitHub's empty default messages.
name: record-commit-message

on:
  push:
    branches: [main]
  pull_request:

jobs:
  message:
    name: record-commit-message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject default GitHub upload messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          if [ "$EVENT" = "pull_request" ]; then
            git fetch origin "$BASE_REF" --depth=50
            commits=$(git log --format=%s "origin/${BASE_REF}..HEAD")
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            commits=$(git log --format=%s "${BEFORE}..${SHA}")
          else
            commits=$(git log -1 --format=%s)
          fi
          bad=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            case "$msg" in
              "Add files via upload"|"Create files via upload"|"Delete files via upload")
                echo "::error::Commit message '$msg' is the GitHub website default."
                echo "Upload is fine. Replace the message with what actually changed,"
                echo "e.g. 'Publish Day 002 photos — front left rear right'."
                bad=1
                ;;
            esac
          done <<EOF
          $commits
          EOF
          if [ "$bad" -ne 0 ]; then
            exit 1
          fi
          echo "Commit messages are usable as public history."
